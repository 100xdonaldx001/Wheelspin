<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wheel Spin</title>
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="titleDisplay">Wheel Spin</h1>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="wheel-wrap">
        <canvas id="wheel" aria-label="Spinning wheel"></canvas>
      </div>
      <button id="spinBtn" class="btn primary big">Spin!</button>
      <div id="result" class="result" hidden>
        <span class="result-label">Winner</span>
        <strong id="resultText"></strong>
        <button id="removeWinner" class="btn small ghost">Remove from wheel</button>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>Customize</h2>

        <label class="field">
          <span>Title</span>
          <input id="title" type="text" maxlength="60">
        </label>

        <div class="field">
          <span>Entries</span>
          <ul id="entries" class="entries"></ul>
          <textarea id="bulk" rows="8" placeholder="One entry per line" hidden></textarea>
          <div class="row">
            <button id="addEntry" class="btn small">+ Add</button>
            <button id="shuffle" class="btn small">Shuffle</button>
            <button id="bulkBtn" class="btn small">Bulk edit</button>
          </div>
        </div>

        <div class="field">
          <span>Color theme</span>
          <div class="row">
            <select id="theme">
              <option value="vivid">Vivid</option>
              <option value="pastel">Pastel</option>
              <option value="sunset">Sunset</option>
              <option value="ocean">Ocean</option>
              <option value="candy">Candy</option>
              <option value="mono">Mono</option>
            </select>
            <button id="applyTheme" class="btn small">Apply to all</button>
          </div>
        </div>

        <div class="grid2">
          <label class="field">
            <span>Spin duration <output id="durationOut">5s</output></span>
            <input id="duration" type="range" min="2" max="12" step="0.5">
          </label>
          <label class="field">
            <span>Background</span>
            <input id="bgColor" type="color">
          </label>
        </div>

        <button id="reset" class="btn small ghost">Reset to defaults</button>
      </div>

      <div class="card">
        <h2>Export as GIF</h2>
        <div class="grid2">
          <label class="field">
            <span>Size</span>
            <select id="gifSize">
              <option value="300">300 × 300</option>
              <option value="400" selected>400 × 400</option>
              <option value="500">500 × 500</option>
              <option value="600">600 × 600</option>
            </select>
          </label>
          <label class="field">
            <span>Frame rate</span>
            <select id="gifFps">
              <option value="20">20 fps (smaller)</option>
              <option value="25" selected>25 fps</option>
              <option value="50">50 fps (smoother)</option>
            </select>
          </label>
        </div>
        <label class="check"><input id="gifLoop" type="checkbox" checked> Loop forever</label>
        <label class="check"><input id="gifReplay" type="checkbox" checked> Use the result of my last spin (if any)</label>

        <button id="exportGif" class="btn primary">Create GIF</button>
        <div id="gifProgress" class="progress" hidden><div id="gifProgressBar"></div></div>

        <div id="gifOut" class="gif-out" hidden>
          <img id="gifPreview" alt="Exported wheel spin GIF">
          <p id="gifInfo" class="muted"></p>
          <a id="gifDownload" class="btn" download="wheelspin.gif">Download GIF</a>
        </div>
      </div>
    </aside>
  </main>

  <script src="gif.js"></script>
  <script src="script.js"></script>
</body>
</html>
